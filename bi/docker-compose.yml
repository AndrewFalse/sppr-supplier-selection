# Локальный стенд Apache Superset для дашборда ЛПР (практики №6 и №8).
# Запуск: docker compose -f bi/docker-compose.yml up -d  ->  http://localhost:8088
name: sppr
services:
  superset:
    image: apache/superset:6.1.0
    container_name: sppr-superset
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports:
      - "8088:8088"
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./bootstrap.sh:/app/bootstrap.sh:ro
      - ../outputs/p6:/app/sppr_data
      - superset_home:/app/superset_home
    command: ["/bin/bash", "/app/bootstrap.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 20
volumes:
  superset_home:

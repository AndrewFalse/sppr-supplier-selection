# СППР выбора поставщиков: прототип (интерфейс ЛПР) + дашборд Apache Superset.
# Запуск:  cp bi/.env.example bi/.env  &&  docker compose up -d --build
#   интерфейс ЛПР  http://localhost:8501
#   дашборд        http://localhost:8088/superset/dashboard/sppr/  (логин и пароль - из bi/.env)
name: sppr
services:
  app:
    build: .
    container_name: sppr-app
    ports:
      - "8501:8501"
    environment:
      SUPERSET_PUBLIC_URL: http://localhost:8088

  superset:
    image: apache/superset:6.1.0
    container_name: sppr-superset
    env_file: bi/.env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports:
      - "8088:8088"
    volumes:
      - ./bi/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./bi/bootstrap.sh:/app/bootstrap.sh:ro
      - ./outputs/p6:/app/sppr_data
      - superset_home:/app/superset_home
    command: ["/bin/bash", "/app/bootstrap.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 30

  # одноразовая сборка дашборда через REST API Superset
  dashboard-init:
    build: .
    container_name: sppr-dashboard-init
    env_file: bi/.env
    environment:
      SUPERSET_URL: http://superset:8088
    depends_on:
      superset:
        condition: service_healthy
    command: ["python", "bi/build_dashboard.py"]
    restart: "no"

volumes:
  superset_home:
